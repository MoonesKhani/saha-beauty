name: Verify and prepare release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: saha-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: saha
          POSTGRES_DB: saha
          POSTGRES_PASSWORD: ci-fixture-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U saha -d saha"
          --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            backend/requirements*.txt
            backend/constraints.txt
      - name: Install pinned dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -c backend/constraints.txt -r backend/requirements-dev.txt -r backend/requirements-postgres.txt playwright==1.56.0
          .venv/bin/python -m pip check
          sudo apt-get update
          sudo apt-get install -y ffmpeg
      - name: Test application and deployment safeguards
        run: |
          .venv/bin/python -m pytest -q
          .venv/bin/python -m unittest discover -s tests -p 'test_*.py' -v
          bash -n scripts/server-update.sh scripts/install-deploy-access.sh scripts/update-deploy-runtime.sh scripts/approved_transport.sh
          .venv/bin/python frontend/build.py
      - name: Test booking transactions on PostgreSQL
        env:
          SAHA_TEST_POSTGRES_URL: postgresql+psycopg://saha:ci-fixture-only@127.0.0.1:5432/saha
        run: .venv/bin/python -m pytest -q backend/tests/test_booking.py
      - name: Test live management and uploads in Chromium
        run: |
          .venv/bin/python -m playwright install --with-deps chromium
          SAHA_CHROMIUM="$(.venv/bin/python -c 'from playwright.sync_api import sync_playwright; p=sync_playwright().start(); print(p.chromium.executable_path); p.stop()')" .venv/bin/python tests/package_browser.py
  prepare:
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build image on GitHub, not on Arvan
        run: docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$GITHUB_SHA" --tag "saha-release:$GITHUB_SHA" .
      - name: Prepare immutable image bundle
        run: python3 scripts/package_release.py --commit "$GITHUB_SHA" --output "$RUNNER_TEMP/release"
      - name: Test container deployment and rollback with disposable data
        env:
          SAHA_RUN_DOCKER_DEPLOY_TEST: '1'
          SAHA_TEST_IMAGE_COMMIT: ${{ github.sha }}
        run: python3 tests/release_container_test.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: saha-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release/release.tar
            ${{ runner.temp }}/release/release.tar.sha256
          retention-days: 14
          compression-level: 0
          if-no-files-found: error
      - name: Release summary
        run: |
          echo "### Prepared; NOT deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "Commit: $GITHUB_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "CI run: $GITHUB_RUN_ID" >> "$GITHUB_STEP_SUMMARY"
          echo "Production requires explicit approval in the Codex conversation and manual deployment dispatch." >> "$GITHUB_STEP_SUMMARY"
